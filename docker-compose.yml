services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://clinic:clinic@db:5432/clinic
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      # used by Next.js on the server, inside the Docker network
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/code
      - /code/node_modules
      - /code/.next
    depends_on:
      - api

volumes:
  db_data:
